<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal | CleanTech Open 2025</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: auto !important;
      min-height: 100% !important;
      overflow-y: auto !important;
      overflow-x: hidden;
    }
    body {
      display: block !important;
      background-color: var(--surface-subdued);
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .admin-container { max-width: 1440px; margin: 40px auto; padding: 20px 32px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
    .btn { background: var(--accent-blue); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #0056b3; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .grid { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(0, 2fr); gap: 24px; }
    .grid > * { min-width: 0; }
    .scorer-item:last-child { border-bottom: none !important; }
    .company-list { max-height: 620px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
    .company-item { display: grid; grid-template-columns: auto minmax(180px, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
    .company-item:last-child { border-bottom: none; }
    .company-details { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .company-name { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .assignment-meta { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    .assignment-badge { white-space: nowrap; }
    .assignment-toolbar { display: grid; grid-template-columns: minmax(180px, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 10px; }
    .assignment-toolbar input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font: inherit; font-size: 13px; }
    .assignment-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .assignment-filter { border: 1px solid var(--border); border-radius: 16px; padding: 6px 10px; background: var(--surface-subdued); color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .assignment-filter.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .assignment-summary { margin: 0 0 10px; color: var(--text-muted); font-size: 12px; font-weight: 600; }
    @media (max-width: 960px) { .admin-container { padding: 20px; } .grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .company-item { grid-template-columns: auto minmax(0, 1fr); } .assignment-badge { grid-column: 2; justify-self: start; } }
  </style>
</head>
<body>
  
  <!-- Login Modal -->
  <div class="modal-overlay" id="admin-login-modal" style="display:none; z-index: 999;">
    <div class="modal-content" style="max-width: 400px; padding: 40px; background:#fff; border-radius:12px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 24px; font-weight: 800;">Admin Portal</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Enter administrator credentials.</p>
      </div>
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="auth-admin-user" placeholder="e.g. admin">
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label for="auth-admin-pass" style="margin-bottom: 0;">Passcode</label>
          <button type="button" onclick="AdminApp.togglePassVisibility('auth-admin-pass', this)" style="background: none; border: none; font-size: 12px; color: var(--accent-blue); cursor: pointer; padding: 0; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;" title="Show or hide password" aria-label="Toggle password visibility">
            👁️ <span class="pass-toggle-label">Show</span>
          </button>
        </div>
        <input type="password" id="auth-admin-pass" placeholder="••••••••">
      </div>
      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="AdminApp.login()">Log In</button>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div class="admin-container" id="admin-dashboard" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h1 style="font-size: 24px; margin: 0;">CleanTech Open - Admin Portal</h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn" style="background: #166534; color: #fff;" onclick="AdminApp.exportScores()">📥 Export Scored Data (CSV)</button>
        <button class="btn" style="background: var(--surface-sunk); color: var(--text-main); border: 1px solid var(--border);" onclick="AdminApp.logout()">Log Out</button>
      </div>
    </div>
    
    <div class="grid">
      <!-- Left Column: Create Scorer -->
      <div>
        <div class="card">
          <h2 style="font-size: 18px; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Create New Scorer</h2>
          <div class="form-group" style="margin-top: 16px;">
            <label>Scorer ID (Username)</label>
            <input type="text" id="new-judge-id" placeholder="e.g. judge_smith">
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label for="new-judge-pass" style="margin-bottom: 0;">Temporary password</label>
              <button type="button" id="toggle-new-pass-btn" onclick="AdminApp.togglePassVisibility('new-judge-pass', this)" style="background: none; border: none; font-size: 12px; color: var(--accent-blue); cursor: pointer; padding: 0; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;" title="Show or hide password" aria-label="Toggle password visibility">
                👁️ <span class="pass-toggle-label">Show</span>
              </button>
            </div>
            <input type="password" id="new-judge-pass" placeholder="Enter a temporary password">
          </div>
          <button class="btn" style="width: 100%;" onclick="AdminApp.createScorer()">Create Scorer</button>
          
          <div id="create-msg" style="margin-top: 12px; font-size: 13px; font-weight: 600; text-align: center;"></div>
          
          <div style="margin-top: 32px;">
            <h3 style="font-size: 15px; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; color: var(--text-main);">Existing Scorers</h3>
            <div id="scorers-list" style="max-height: 280px; overflow-y: auto; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-subdued);">
              <!-- Scorers injected here -->
            </div>
          </div>
          
          <div style="margin-top: 32px;">
            <h3 style="font-size: 15px; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; color: var(--text-main);">Assignment Distribution</h3>
            <div id="assignment-chart" style="padding: 10px 0;"></div>
          </div>

        </div>
      </div>
      
      <!-- Right Column: Assignments -->
      <div>
        <div class="card">
          <h2 style="font-size: 18px; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Company Assignments</h2>
          
          <div class="form-group" style="margin-top: 16px;">
            <label>Select Scorer to Assign Companies</label>
            <select id="judge-select" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;" onchange="AdminApp.renderAssignments()">
              <option value="">-- Choose a Scorer --</option>
            </select>
          </div>
          <div class="assignment-toolbar">
            <input id="company-search" type="search" placeholder="Search companies" oninput="AdminApp.setSearch(this.value)">
            <div class="assignment-filters">
              <button class="assignment-filter active" data-filter="all" onclick="AdminApp.setAssignmentFilter('all')">All</button>
              <button class="assignment-filter" data-filter="assigned" onclick="AdminApp.setAssignmentFilter('assigned')">Assigned</button>
              <button class="assignment-filter" data-filter="unassigned" onclick="AdminApp.setAssignmentFilter('unassigned')">Unassigned</button>
            </div>
          </div>
          <div class="assignment-summary" id="assignment-summary"></div>
          <div class="company-list" id="company-list-container">
            <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Please select a scorer first.</div>
          </div>
          
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin.js?v=5"></script>
</body>
</html>
